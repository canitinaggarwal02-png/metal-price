name: Daily metal prices
on:
  schedule:
    - cron: "15 2 * * 1-6"   # 7:45 am IST, Monday to Saturday
    - cron: "15 11 * * 1-5"  # 4:45 pm IST, weekdays
    - cron: "0,30 3-13 * * 1-6"   # every 30 min, 8:30 am - 7 pm IST
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_prices.py
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update metal prices"
          git push
